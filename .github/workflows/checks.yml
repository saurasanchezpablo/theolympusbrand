# Every push: the tests, the site in a real browser at four screen sizes, the generated files
# rebuilt and compared with the committed ones, and the server image.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run site
      - name: The site, driven in Chrome
        run: npm run app:check
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Every page at phone, tablet, laptop and desktop sizes, with an accessibility audit
        run: npm run app:viewports
        env:
          CHROME_PATH: /usr/bin/google-chrome

  reproducible:
    name: Generated files are reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run model -- master
      - run: npm run sticker -- master && npm run sticker -- sheet && npm run sticker -- sheet --art crest --size 60 --style marble-dark
      - name: Nothing changed
        run: |
          git status --short
          git diff --stat --exit-code

  image:
    name: Server image builds
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/Dockerfile -t theolympus .
      - name: The one service serves the site, the map's API and its build status
        run: |
          docker run -d -p 8080:8080 -v olympus-data:/var/lib/olympus/data -v olympus-site:/var/lib/olympus/site --name olympus theolympus
          for i in $(seq 1 180); do curl -fsS http://127.0.0.1:8080/build.json 2>/dev/null | grep -q '"state":"ok"' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/build.json
          curl -fsS http://127.0.0.1:8080/build.json | grep -q '"state":"ok"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>The Olympus</title>'
          curl -fsS http://127.0.0.1:8080/files/index.json | grep -q 'assets/master'
          curl -fsSI http://127.0.0.1:8080/files/assets/master/web/site.webmanifest | grep -qi 'application/manifest+json'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy'
          curl -fsSI -H 'accept-encoding: br' http://127.0.0.1:8080/ | grep -qi 'content-encoding: br'
          curl -fsS http://127.0.0.1:8080/api/session | grep -q '"editing":false'
          curl -fsS http://127.0.0.1:8080/api/map | grep -q '"items"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8080/api/places/nextcloud)" = 401
      - name: Its state survives a new container
        run: |
          echo olympus-ci-password | docker exec -i olympus node scripts/editor.ts password --stdin
          docker rm -f olympus
          docker run -d -p 8080:8080 -v olympus-data:/var/lib/olympus/data -v olympus-site:/var/lib/olympus/site --name olympus theolympus
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>The Olympus</title>'
          curl -fsS -X POST -H 'content-type: application/json' -d '{"password":"olympus-ci-password"}' http://127.0.0.1:8080/api/login | grep -q csrf
      - if: failure()
        run: docker logs olympus || true
