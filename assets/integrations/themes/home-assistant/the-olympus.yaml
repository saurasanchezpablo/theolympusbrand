# The Olympus — Home Assistant theme (Home Assistant 2026.10).
# Goes in <config>/themes/ (apply.sh puts it there). Then: Developer tools →
# Actions → "Frontend: Reload themes", and choose "The Olympus" on your
# profile page. Light or dark follows your profile's setting.
"The Olympus":
  # The house's square corners.
  ha-card-border-radius: "2px"
  ha-card-border-width: "1px"
  # Home Assistant's own colour scale, in greys (not documented: may change).
  ha-color-primary-05: "#0E0E0E"
  ha-color-primary-10: "#1C1C1C"
  ha-color-primary-20: "#2B2B2B"
  ha-color-primary-30: "#3A3A3A"
  ha-color-primary-40: "#4A4A4A"
  ha-color-primary-50: "#5E5E5E"
  ha-color-primary-60: "#7A7A7A"
  ha-color-primary-70: "#9A9A9A"
  ha-color-primary-80: "#C9C9C9"
  ha-color-primary-90: "#E1E1E1"
  ha-color-primary-95: "#EDEDED"
  modes:
    light:
      primary-color: "#1C1C1C"
      accent-color: "#5E5E5E"
      light-primary-color: "#E1E1E1"
      dark-primary-color: "#0E0E0E"
      text-primary-color: "#FAFAFA"
      primary-background-color: "#FAFAFA"
      secondary-background-color: "#F5F5F5"
      card-background-color: "#FFFFFF"
      primary-text-color: "#1C1C1C"
      secondary-text-color: "#5E5E5E"
      disabled-text-color: "#9A9A9A"
      divider-color: "#E1E1E1"
      state-icon-color: "#5E5E5E"
      sidebar-background-color: "#F5F5F5"
      sidebar-text-color: "#1C1C1C"
      sidebar-icon-color: "#5E5E5E"
      sidebar-selected-text-color: "#0E0E0E"
      sidebar-selected-icon-color: "#0E0E0E"
      app-header-background-color: "#F5F5F5"
      app-header-text-color: "#1C1C1C"
      ha-card-border-color: "#E1E1E1"
      error-color: "#9B3C31"
      warning-color: "#86651C"
      success-color: "#3E6E4C"
      info-color: "#34568E"
    dark:
      primary-color: "#EDEDED"
      accent-color: "#9A9A9A"
      light-primary-color: "#3A3A3A"
      dark-primary-color: "#FAFAFA"
      text-primary-color: "#0E0E0E"
      primary-background-color: "#0E0E0E"
      secondary-background-color: "#161616"
      card-background-color: "#1C1C1C"
      primary-text-color: "#EDEDED"
      secondary-text-color: "#9A9A9A"
      disabled-text-color: "#5E5E5E"
      divider-color: "#3A3A3A"
      state-icon-color: "#9A9A9A"
      sidebar-background-color: "#161616"
      sidebar-text-color: "#EDEDED"
      sidebar-icon-color: "#9A9A9A"
      sidebar-selected-text-color: "#FAFAFA"
      sidebar-selected-icon-color: "#FAFAFA"
      app-header-background-color: "#161616"
      app-header-text-color: "#EDEDED"
      ha-card-border-color: "#3A3A3A"
      error-color: "#C46A5C"
      warning-color: "#C9A55E"
      success-color: "#7FA98B"
      info-color: "#7391C4"
