    highlight-secondary: "#3A3A3A"
    highlight-hover: "#5E5E5E"
    background: "#EDEDED"
    card-background: "#FAFAFA"
    text: "#1C1C1C"
    text-header: "#FAFAFA"
    text-title: "#1C1C1C"
    text-subtitle: "#5E5E5E"
    card-shadow: "rgba(0, 0, 0, 0.08)"
    link: "#1C1C1C"
    link-hover: "#5E5E5E"
