# The Olympus — Homer
# Generated from the catalogue (npm run integrations). Copy to assets/config.yml; the icons to assets/icons/.

title: "The Olympus"
subtitle: "theolympus.cloud"
logo: "assets/icons/olympus.png"
header: true
footer: false
theme: default
colors:
