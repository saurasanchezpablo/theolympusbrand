    highlight-primary: "#1C1C1C"
    highlight-secondary: "#3A3A3A"
    highlight-hover: "#5E5E5E"
    background: "#0E0E0E"
    card-background: "#1C1C1C"
    text: "#EDEDED"
    text-header: "#EDEDED"
    text-title: "#FAFAFA"
    text-subtitle: "#9A9A9A"
    card-shadow: "rgba(0, 0, 0, 0.4)"
    link: "#EDEDED"
    link-hover: "#9A9A9A"
