# The Olympus — tmux in the house's greys.
set -g status-style "fg=#c9c9c9,bg=#1c1c1c"
set -g status-left " ▲ #S "
set -g status-left-style "fg=#fafafa,bg=#3a3a3a"
set -g status-left-length 30
set -g status-right " #H · %H:%M "
set -g status-right-style "fg=#c9c9c9,bg=#1c1c1c"
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-current-style "fg=#0e0e0e,bg=#c9c9c9"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#9a9a9a"
set -g message-style "fg=#fafafa,bg=#3a3a3a"
set -g mode-style "fg=#fafafa,bg=#5e5e5e"
