# The Olympus — the site, served as static files. Nothing here talks to the
# internet: fonts, scripts and files are all served from this server.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Every type the site serves (a `types` block here replaces nginx's list).
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    image/svg+xml svg;
    image/png png;
    image/x-icon ico;
    font/woff woff;
    font/woff2 woff2;
    application/pdf pdf;
    text/markdown md;
    text/plain scad txt yaml yml sh;
    text/csv csv;
    model/stl stl;
    model/3mf 3mf;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/markdown text/plain text/csv text/css application/json;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/markdown text/plain model/stl;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Built scripts and styles carry a hash in their names: cache them for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The brand's files change when the repository does.
  location /files/ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
