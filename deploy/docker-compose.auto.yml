# The Olympus — the site, following the repository: one service, one port.
#
#   cd deploy && docker compose -f docker-compose.auto.yml up -d --build
#   docker compose -f docker-compose.auto.yml exec olympus node scripts/editor.ts password
#
# Run it from a git clone on the server. The service works in the clone: it
# watches catalog/ and data/ — change a service there, or on the map, and the
# site follows within seconds — and pulls from the remote every
# OLYMPUS_GIT_INTERVAL minutes (0: never). The first start installs and builds
# everything (a few minutes); after that, only what changed. Then open
# http://<server>:8080.
#
# It runs as uid 1000 (the node image's user): the clone must be writable by it
# (chown -R 1000:1000 the clone, or set user: to your own uid and gid).
# data/ in the clone is the server's own state — never committed; back it up.
services:
  olympus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: theolympus
    container_name: olympus
    working_dir: /repo
    ports:
      - "8080:8080"
    volumes:
      - ..:/repo
      - node_modules:/repo/node_modules
      - site:/var/lib/olympus/site
    environment:
      OLYMPUS_DATA: /repo/data
      OLYMPUS_GIT_INTERVAL: "10"
      OLYMPUS_GIT_REMOTE: origin
      # The clone is owned by the host's user; let git work in it anyway.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  node_modules:
  site:
