# The Olympus — the site on your server: one service, one port.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec olympus node scripts/editor.ts password
#
# Then open http://<server>:8080 — or put it behind your reverse proxy. The
# map's changes are kept in the `data` volume; the published releases in
# `site` (rebuilt from the image and the data when it is lost).
services:
  olympus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: theolympus
    container_name: olympus
    ports:
      - "8080:8080"
    volumes:
      - data:/var/lib/olympus/data
      - site:/var/lib/olympus/site
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  data:
  site:
