# The Olympus — the site on your server.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then open http://<server>:8080 — or put it behind your reverse proxy.
services:
  olympus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: theolympus-site
    container_name: olympus
    ports:
      - "8080:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
